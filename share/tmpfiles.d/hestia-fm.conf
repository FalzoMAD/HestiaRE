# HestiaRE file manager runtime socket dir (#419). /run is tmpfs → recreated each
# boot before php-fpm/nginx start. Holds the per-customer pool sockets fm-<user>.sock.
# 0755 so the panel FPM user can stat a socket (fm-auth's enabled-gate) and the
# front webserver (www-data) can connect. The /run/hestia line is idempotent with
# the SFTP jail's own tmpfiles entry when both are installed.
d /run/hestia       0755 root root -
d /run/hestia/fm    0755 root root -
