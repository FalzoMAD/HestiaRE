# HestiaRE CrowdSec fleet-mesh runtime dir (#485). /run is tmpfs → recreated each boot before
# php-fpm starts, and h-update-crowdsec-mesh refills the contents. Holds what the panel endpoints
# answer from: the published ban payload and the per-peer token hashes.
# root:hestia 0750 - only the panel FPM pool may read; `in` is 0730 so the panel can hand a pairing
# payload over in a file (argv is world-readable via /proc) without being able to list the directory.
d /run/hestia          0755 root root -
d /run/hestia/mesh     0750 root hestia -
d /run/hestia/mesh/in  0730 root hestia -
