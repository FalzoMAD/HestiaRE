# SnappyMail's own fail2ban log (auth_logging = On). {request:ip} reads Client-IP first, which the webmail
# vhost sets to the real client - X-Forwarded-For is clobbered by the panel-Caddy hop. No unwrapping needed.

[Definition]

# No leading anchor: the datepattern below consumes the "[<date>" prefix, leaving "] Auth failed: ...".
# ip= precedes the attacker-controlled user= field, so the IP cannot be forged through the username.
failregex = Auth failed: ip=<HOST> user=

ignoreregex =

datepattern = ^\[({DATE})
              {^LN-BEG}
