# Failed SnappyMail webmail logins, from /var/log/snappymail/fail2ban/auth.txt (auth_logging = On).
#
# SnappyMail's own fail2ban log format: "[<date>] Auth failed: ip=<client> user=... host=... port=...".
# {request:ip} resolves via GetClientIp with http_client_ip_check_proxy, which reads Client-IP first - set
# to the real client by the webmail vhost (X-Forwarded-For is clobbered by the panel-Caddy hop). So <HOST>
# here is already the real client, no annotation to unwrap as with Roundcube.

[Definition]

# No leading anchor: the datepattern below consumes the "[<date>" prefix, leaving "] Auth failed: ...".
# ip= precedes the attacker-controlled user= field, so the IP cannot be forged through the username.
failregex = Auth failed: ip=<HOST> user=

ignoreregex =

datepattern = ^\[({DATE})
              {^LN-BEG}
