# 401 ONLY, never 403: that has too many benign causes (hotlink-deny, secret gates, geo ACLs) and can burst
# on one legitimate page load. Counted AGGREGATED over every vhost, which is why maxretry looks high.

[Definition]

failregex = ^<HOST> \- \S+ \[\] "[A-Z]+ [^"]*" 401 \d

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
