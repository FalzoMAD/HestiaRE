# Repeated HTTP 401 (authentication failures) from one source on customer vhosts (per-domain 'combined'
# access log). 401 ONLY - deliberately never a global 403, which has too many benign causes (hotlink-deny,
# directory-deny, secret-gates, geo/IP ACLs) and can burst on a single legitimate page load.
#
# Counts per source IP over the domain-wide log glob, i.e. AGGREGATED across every vhost on the box, not
# per domain. On the target shape (hundreds of domains per host) a shared NAT/monitoring IP touching
# auth-protected areas on several sites adds up, so the jail's maxretry is chosen conservatively for that
# aggregate - it is not "high".

[Definition]

failregex = ^<HOST> \- \S+ \[\] "[A-Z]+ [^"]*" 401 \d

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
