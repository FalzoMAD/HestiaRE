# Probe detection for customer vhosts, reading the per-domain 'combined' ACCESS log.
#
# Not the error log, and not the distro's apache-botsearch, because neither works here (both measured):
# nginx writes no error entry at all for a 404, and apache with php-fpm answers a probe for a missing .php
# with AH01071 "Primary script unknown" instead of "File does not exist" - so apache-botsearch matches
# nothing on HestiaRE, quite apart from its webroot being hardcoded to /var/www while ours are under /home.
# The access log is the same 'combined' format for nginx, for apache, and for nginx-in-front-of-apache, so
# one filter covers all three web models.
#
# The 404 is what makes this safe on shared hosting: a domain that really runs WordPress answers
# /wp-login.php with 200, so a real user is never counted - only a probe for an app that is not there.
#
# <block> comes from the distro's botsearch-common.conf (wp-login/signup/admin, phpmyadmin, webmail,
# cgi-bin, mysqladmin), so the probe vocabulary stays maintained by the package rather than by us.

[INCLUDES]

before = botsearch-common.conf

[Definition]

failregex = ^<HOST> \- \S+ \[\] "(GET|POST|HEAD) \/<block> \S+" 404 .+$

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
