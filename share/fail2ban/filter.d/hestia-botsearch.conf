# The ACCESS log, not the error log and not the distro's apache-botsearch: both measured to match nothing
# here - nginx logs no error for a 404, and apache with php-fpm says AH01071, not "File does not exist".
#
# The 404 is what makes it safe on shared hosting: a domain really running WordPress answers /wp-login.php
# with 200, so only a probe for an app that is not there counts. <block> keeps the vocabulary with the distro.

[INCLUDES]

before = botsearch-common.conf

[Definition]

failregex = ^<HOST> \- \S+ \[\] "(GET|POST|HEAD) \/<block> \S+" 404 .+$

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
