# Secret/config file DISCOVERY, status-agnostic: probing for a file that must never be web-served is
# malicious whether it answers 404 or 403. NOT a WAF - literal strings, so /%2e%65nv evades by design.

[Definition]

failregex = ^<HOST> \- \S+ \[\] "(GET|POST|HEAD|PUT) [^"]*(/\.env|/\.git/|/\.svn/|/\.hg/|/\.bzr/|/\.ssh/|/id_rsa|/\.htpasswd|/\.aws/|/\.DS_Store|/wp-config\.php[~.]|/config\.php\.(bak|old|save|swp)|/configuration\.php|/phpinfo\.php|/(shell|c99|r57|webshell)\.php)

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
