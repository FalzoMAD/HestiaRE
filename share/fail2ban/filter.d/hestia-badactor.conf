# Secret/config file DISCOVERY on customer vhosts (per-domain 'combined' access log), status-agnostic: a
# probe for a file that must never be web-served is malicious whether it answers 404 or 403. Distinct from
# hestia-exploit, which is code-execution/traversal - this jail is "you are looking for files that should
# not be here". NOT a WAF: literal strings, so URL-encoded variants (/%2e%65nv) evade by design; a cheap,
# maintainable signature layer, no substitute for application-level security.
#
# Same combined-log format for nginx, apache, and nginx-in-front-of-apache, so one filter covers all
# three web models (as with hestia-botsearch). The date is stripped by datepattern, hence the empty [].

[Definition]

failregex = ^<HOST> \- \S+ \[\] "(GET|POST|HEAD|PUT) [^"]*(/\.env|/\.git/|/\.svn/|/\.hg/|/\.bzr/|/\.ssh/|/id_rsa|/\.htpasswd|/\.aws/|/\.DS_Store|/wp-config\.php[~.]|/config\.php\.(bak|old|save|swp)|/configuration\.php|/phpinfo\.php|/(shell|c99|r57|webshell)\.php)

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
