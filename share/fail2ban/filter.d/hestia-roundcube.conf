# <HOST> is the X-Real-IP value, not the leading 127.0.0.1 (the panel-Caddy socket peer). The <user> field is
# attacker-controlled and logged verbatim, so a crafted username can smuggle a fake "X-Real-IP:" block:
# anchoring the trailer to end-of-line backtracks the greedy user match to the LAST, genuine one.

[Definition]

failregex = Failed login for .* from \S+ \(X-Real-IP: <HOST>,X-Forwarded-For: \S+\) in session \w+ \(error: \d+\)$

ignoreregex =

datepattern = ^\[({DATE})
              {^LN-BEG}
