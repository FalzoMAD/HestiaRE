# Failed Roundcube logins from /var/log/roundcube/userlogins.log (Roundcube appends .log to the name).
# Line: "[date]: <sid> Failed login for <user> from 127.0.0.1 (X-Real-IP: <client>,X-Forwarded-For: ...)
# in session <sid> (error: N)". Two non-obvious points drive the regex:
#
#   - <HOST> is the X-Real-IP value, not the leading 127.0.0.1 (the panel-Caddy socket peer). remote_ip()
#     appends the X-Real-IP annotation only when the proxy is trusted (proxy_whitelist).
#   - The <user> field is attacker-controlled and logged verbatim, so a crafted username can smuggle a fake
#     "X-Real-IP: ..." block into the line. Anchoring the real trailer to end-of-line lets the greedy user
#     match backtrack to the LAST block, which is the genuine one Roundcube always appends after the user.

[Definition]

failregex = Failed login for .* from \S+ \(X-Real-IP: <HOST>,X-Forwarded-For: \S+\) in session \w+ \(error: \d+\)$

ignoreregex =

datepattern = ^\[({DATE})
              {^LN-BEG}
