# HestiaRE admin panel - HTTPS on port 8083
# Deployed to /etc/caddy/hestia.conf

https://:8083 {
    tls /usr/local/hestia/ssl/certificate.crt /usr/local/hestia/ssl/certificate.key

    root * /usr/local/hestia/web

    log {
        output file /var/log/caddy/access.log
        format json
    }

    header {
        X-Content-Type-Options nosniff
        X-Frame-Options SAMEORIGIN
        X-XSS-Protection "1; mode=block"
        -Server
    }

    # Skip /download/*: re-gzipping already-compressed archives (and GB-scale backups) burns CPU for
    # no win and can interfere with ranges (#443). Everything else is compressed.
    @encodable not path /download/*
    encode @encodable gzip

    request_body {
        max_size 1g
    }

    handle_errors {
        root * /usr/local/hestia/web
        @5xx expression `{http.error.status_code} >= 500`
        handle @5xx {
            rewrite * /error/50x.html
            file_server
        }
        @410 expression `{http.error.status_code} == 410`
        handle @410 {
            rewrite * /error/410.html
            file_server
        }
        handle {
            rewrite * /error/404.html
            file_server
        }
    }

    # Panel apps (phpMyAdmin, Adminer) - each served from its own webroot
    # via a dedicated caddy FPM pool. Route snippets are written to
    # /etc/caddy/apps/ by h-change-sys-db-alias (phpMyAdmin) and h-add-sys-adminer;
    # a placeholder keeps this glob non-empty on first start.
    # Panel apps + the optional file manager (/fm/*, #419) are imported here.
    # h-add-sys-filemanager writes apps/filemanager.conf (forward_auth → per-customer
    # pool); absent when not installed → /fm/ is a plain 404.
    import /etc/caddy/apps/*.conf

    # PHP application with X-Accel-Redirect support. Only list/rrd (a caddy-readable
    # panel file under the web root) still uses it; the download/{backup,database,site}
    # routes stream via PHP readfile() instead, because file_server here runs as caddy
    # and cannot read the customer-owned files (#441).
    route {
        # Nothing under these is meant to be fetched over HTTP: they are include-only
        # PHP, render fragments and gettext data (i18n reads languages.json from disk,
        # not via a request). Without this every one of them is reachable unauthenticated
        # - .sh/.pot are served as source and a template renders its own markup outside
        # any auth context. Must stay first in the route: `respond` sorts after
        # `file_server` in Caddy's directive order, so only source order inside a route
        # puts it ahead of both the FastCGI pass and the static handler.
        @internal path /inc/* /locale/* /templates/*
        respond @internal 404
        @sensitive path *.map *.log *.sh *.sql *.bak *.env
        respond @sensitive 404

        # Redirect bare directory paths to trailing-slash form when index.php exists
        @canonicalPath {
            file {
                try_files {path}/index.php
            }
            not path */
        }
        redir @canonicalPath {http.request.uri.path}/

        # Resolve directory requests to their index.php
        @indexFiles file {
            try_files {path} {path}/index.php index.php
            split_path .php
        }
        rewrite @indexFiles {http.matchers.file.relative}

        # FastCGI - intercept X-Accel-Redirect to serve files directly.
        # `*.php` must be a named matcher: as an inline token, reverse_proxy parses
        # it as a second upstream (*.php:80) and load-balances onto it → 502.
        @php path *.php
        reverse_proxy @php unix//run/hestia-php.sock {
            transport fastcgi {
                split .php
                read_timeout 600s
            }
            @accel header X-Accel-Redirect *
            handle_response @accel {
                root * /
                rewrite * {http.response.header.X-Accel-Redirect}
                file_server
            }
        }
    }

    file_server
}
