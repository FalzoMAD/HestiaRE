# HestiaRE web bot rate-limit (Layer B) families. One family per line, Hestia object format.
# Server-native (nginx limit_req / apache mod_qos), independent of CrowdSec - available on any web
# install. Rendered by func/botpolicy.sh into the nginx maps + limit_req zones (and the apache
# mod_qos counters) that the per-domain fragments reference. Seeded to /etc/hestia/botfamilies.conf
# on web install; edit the INSTANCE copy (it survives updates), then run 'h-update-sys-botfamilies'.
#
# Fields: FAMILY (name, [a-z0-9_]), MATCH (UA regex alternation, case-insensitive), LENIENT +
# STRICT (nginx rate, e.g. 120r/m - the two levels a domain can pick), ENABLED (yes/no). BURST
# and NODELAY are advanced per-family limit_req tuning, conf-only (not shown in the panel).
#
# Model: Layer B ONLY throttles bots (429). Humans are unlimited; malicious traffic is CrowdSec's
# job (ban -> 403), not rate-limiting. Keying is per-family aggregate (one bucket per family, so a
# crawler fleet cannot drain another family's budget). Rates are starting points - tune to taste.
# 8 curated families + 2 empty slots below. The renderer always emits 'generic' LAST in the UA map
# (first match wins), so custom families win over the catch-all wherever you place them.
FAMILY='googlebot' MATCH='googlebot|google-inspectiontool|storebot-google' LENIENT='120r/m' STRICT='60r/m' BURST='10' NODELAY='yes' ENABLED='yes'
FAMILY='amazon' MATCH='amazonbot|amazon' LENIENT='120r/m' STRICT='60r/m' BURST='10' NODELAY='yes' ENABLED='yes'
FAMILY='bing' MATCH='bingbot|msnbot' LENIENT='120r/m' STRICT='60r/m' BURST='10' NODELAY='yes' ENABLED='yes'
FAMILY='ai' MATCH='gptbot|oai-searchbot|chatgpt-user|claudebot|claude-web|perplexitybot|google-extended|bytespider|ccbot' LENIENT='60r/m' STRICT='20r/m' BURST='10' NODELAY='yes' ENABLED='yes'
FAMILY='meta' MATCH='facebookexternalhit|meta-externalagent|facebookbot|instagram' LENIENT='20r/m' STRICT='5r/m' BURST='5' NODELAY='yes' ENABLED='yes'
FAMILY='seo' MATCH='ahrefs|semrush|mj12|dotbot|petalbot|serpstat|blexbot' LENIENT='30r/m' STRICT='10r/m' BURST='5' NODELAY='yes' ENABLED='yes'
FAMILY='social' MATCH='twitterbot|linkedinbot|telegrambot|slackbot|discordbot|whatsapp' LENIENT='60r/m' STRICT='30r/m' BURST='10' NODELAY='yes' ENABLED='yes'
FAMILY='generic' MATCH='bot|crawl|spider' LENIENT='30r/m' STRICT='10r/m' BURST='5' NODELAY='yes' ENABLED='yes'
# Empty admin slots - fill MATCH + rates and enable them (generic stays last automatically).
