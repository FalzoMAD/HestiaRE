# HestiaRE drop-in for the packaged roundcube-gc/-cleandb units. The pool user owns ALL
# Roundcube state here (/var/lib/roundcube/temp, the sqlite db dir, the group-read DB creds) -
# the package default www-data can read none of it: under sqlite every run errors, under mysql
# it silently does nothing (#584). Both directives are needed: the packaged unit pins user AND
# group to www-data explicitly, so overriding only the user would still run with its group.
# Deployed by h-add-sys-roundcube into both .service.d dirs.
[Service]
User=caddy
Group=caddy
