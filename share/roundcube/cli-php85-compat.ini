; PHP 8.5's core array_first()/array_last() vs Roundcube <= 1.6.11's unguarded
; declarations - same fix as the FPM pool (see pool.d/roundcube.conf), here for
; the packaged gc/cleandb maintenance units whose scripts run /usr/bin/php.
; Reached ONLY via the PHP_INI_SCAN_DIR append in the systemd drop-in - the
; customer CLI never sees it.
disable_functions = array_first,array_last
