# HestiaRE nginx web-log acquisition for CrowdSec (#186). Rendered by the apply helper
# (%WEB_SYSTEM% -> the configured web system), only when nginx is the public front.
# The nginx front writes per-domain 'combined' logs to /var/log/<web_system>/domains/
# because the vhost template uses the web_system token; in the 'both' model that is
# /var/log/apache2/domains, but it is still nginx's own front log with the real client
# IP. The nginx collection parses both the access and .error.log files this glob matches.
# The per-IP catch-all vhosts log nowhere yet (access_log off); once enabled to
# /var/log/nginx/unassigned.log, add it as a second source here.
filenames:
  - /var/log/%WEB_SYSTEM%/domains/*.log
labels:
  type: nginx
