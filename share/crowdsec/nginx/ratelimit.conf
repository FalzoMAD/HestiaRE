# HestiaRE CrowdSec Layer-B: native rate-limit (429) + bot policy (#186). Included in the
# nginx http{} by the apply helper. Per-domain behaviour is chosen at vhost-render time by
# selecting zones; the good-bot classification runs at request time here.
#
# Rates, burst and the bot list are PLACEHOLDERS - to be curated before release.

# Known legitimate crawlers (search + AI). 1 = recognised good bot. UA-based, so it is
# spoofable - which is why no policy below ever grants a good bot a full exemption.
map $http_user_agent $cs_good_bot {
	default 0;
	"~*(googlebot|google-inspectiontool|google-extended|bingbot|duckduckbot|yandex(bot|images)|baiduspider|applebot|slurp|claudebot|claude-web|gptbot|oai-searchbot|chatgpt-user|perplexitybot)" 1;
}

# Separate keyspaces for the 'pass' policy so a (spoofable) good-bot UA can neither escape
# the rate-limit nor drain the human bucket. Humans are keyed by IP and bots skip those
# zones (empty key); bots are keyed by IP into their own bounded zone and humans skip it.
# Nobody is ever fully exempt - a spoofed UA only moves a client into the bounded bot bucket.
map $cs_good_bot $cs_human_key {
	default $binary_remote_addr;
	"1" "";
}
map $cs_good_bot $cs_bot_key {
	default "";
	"1" $binary_remote_addr;
}

# throttle: one shared per-IP bucket (good bots limited like everyone else).
limit_req_zone $binary_remote_addr zone=cs_lenient:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cs_strict:10m  rate=10r/s;
# pass: humans keep the normal per-IP limit; recognised good bots get a separate, generous
# but BOUNDED per-IP bucket - legit crawlers run freely under the cap, spoofers stay capped.
limit_req_zone $cs_human_key zone=cs_lenient_h:10m rate=30r/s;
limit_req_zone $cs_human_key zone=cs_strict_h:10m  rate=10r/s;
limit_req_zone $cs_bot_key   zone=cs_bot:10m rate=100r/s;
limit_req_status 429;
