# HestiaRE CrowdSec Layer-A init (#186), included in nginx http{} by the apply helper
# (only when nginx is the public front). Sets up the own bouncer once; enforcement is
# per-vhost (a fragment calls require("hestia_bouncer").allow()), NOT global here, so a
# domain can opt out and the FM loopback listener stays untouched.
lua_package_path "/usr/local/hestia/lua/?.lua;;";
lua_shared_dict crowdsec_cache 16m;

# Load the bouncer + its key/config (host/port/api_key/ttls), which the apply helper
# writes to /etc/crowdsec/bouncers/hestia-nginx.lua after `cscli bouncers add`. Missing
# config logs and leaves allow() a no-op (fail-open), never a hard nginx failure.
init_by_lua_block {
	local ok, cfg = pcall(dofile, "/etc/crowdsec/bouncers/hestia-nginx.lua")
	if ok and type(cfg) == "table" then
		require("hestia_bouncer").init(cfg)
	else
		ngx.log(ngx.ERR, "[crowdsec] bouncer config missing/invalid: ", tostring(cfg))
	end
}
