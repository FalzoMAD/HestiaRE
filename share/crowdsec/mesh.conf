# HestiaRE CrowdSec fleet-mesh config. Its presence enables the mesh (the timer feeds it); managed
# by h-add/delete-sys-crowdsec-mesh. Peer-mesh, no central LAPI: this box PUBLISHES its own local
# web-tier bans to MESH_PUBLISH for peers to pull, and IMPORTS the union of peers' published lists
# (which your fleet transport - rsync/ssh/shared FS - drops into MESH_PEERS_DIR) as L7-only mesh
# bans. Enforcement is automatic: the L7 bouncer blocks imported decisions (403); the L3 feeder
# filters origin==crowdsec, so mesh bans stay off the firewall. IPv4 payload only.
#
# The transport is deliberately out of scope here (it is your fleet's own trust fabric): HestiaRE
# reads/writes files, you arrange for each peer's MESH_PUBLISH to arrive in this box's MESH_PEERS_DIR
# (authenticated + fleet-scoped). Keep the payload IP-only.
MESH_TTL='30m'
MESH_PUBLISH='/var/lib/crowdsec/mesh/published.json'
MESH_PEERS_DIR='/var/lib/crowdsec/mesh/peers'
# Blast-radius caps: a buggy/compromised peer must not flood the fleet. Only well-formed single IPv4
# values are imported (CIDR/garbage dropped); at most MESH_MAX_PER_PEER per peer + MESH_MAX_TOTAL in
# the union. Imported bans are tagged scenario hestia-mesh:<peer> so a bad IP stays attributable.
MESH_MAX_PER_PEER='5000'
MESH_MAX_TOTAL='50000'
