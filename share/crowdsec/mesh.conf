# HestiaRE CrowdSec fleet-mesh config. Its presence enables the mesh (the timer feeds it); managed
# by h-add/delete-sys-crowdsec-mesh. Peer-mesh, no central LAPI: this box PUBLISHES its own local
# web-tier bans and IMPORTS the union of its peers' lists as L7-only mesh bans. Enforcement is
# automatic: the L7 bouncer blocks imported decisions (403); the L3 feeder filters origin==crowdsec,
# so mesh bans stay off the firewall. IPv4 payload only.
#
# Transport = an authenticated pull over the panel port. Pairing (panel Fleet Mesh page, or
# h-generate-sys-crowdsec-pairing + h-add-sys-crowdsec-peer) needs an admin on BOTH boxes and leaves
# each side with a per-peer token, the peer's TLS key pin and an IP-scoped ACCEPT rule; the timer pulls
# from there. The LAPI stays loopback-only - only a file of IP values crosses the wire. A list dropped
# into MESH_PEERS_DIR by hand is imported just the same, so a self-wired transport still works (keep
# such payloads IP-only).
MESH_TTL='30m'
MESH_PUBLISH='/var/lib/crowdsec/mesh/published.json'
MESH_PEERS_DIR='/var/lib/crowdsec/mesh/peers'
# Blast-radius caps: a buggy/compromised peer must not flood the fleet. Only well-formed single IPv4
# values are imported (CIDR/garbage dropped); at most MESH_MAX_PER_PEER per peer + MESH_MAX_TOTAL in
# the union. Imported bans are tagged scenario hestia-mesh:<peer> so a bad IP stays attributable.
MESH_MAX_PER_PEER='5000'
MESH_MAX_TOTAL='50000'
# A peer that stops answering keeps its last list until it goes stale (minutes), so a brief outage does
# not unban the fleet while one that stays gone eventually stops counting.
MESH_STALE_MIN='360'
# Pairing window: seconds a minted code stays valid, and how many wrong guesses kill it outright. Short
# and single-use by design - the code is the only thing gating /mesh-pair.php.
MESH_PAIRING_TTL='900'
MESH_PAIRING_TRIES='5'
