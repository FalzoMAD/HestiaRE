# HestiaRE Layer-B for the apache-only web model (#186): native mod_qos rate-limit (429).
# apache-only never runs CrowdSec (nginx-gated), so this is standalone rate-limiting driven
# by the same per-domain RATE_LIMIT/BOT_POLICY flags. Installed by install_web when apache
# is the public front. mod_qos event counters are SERVER scope (cannot live in a vhost);
# each per-domain vhost fragment selects a profile by setting the matching QS_Event_* var,
# and good-bot handling is done per vhost. Rates are PLACEHOLDERS - curate before release.
QS_ClientEntries 100000
QS_ErrorResponseCode 429
QS_ClientEventLimitCount 300 10 QS_Event_lenient
QS_ClientEventLimitCount 100 10 QS_Event_strict
# 'pass': recognised good bots go here instead of being fully exempt - generous but BOUNDED,
# so a spoofed good-bot UA is still capped and cannot drain the human counters.
QS_ClientEventLimitCount 1000 10 QS_Event_bot
