; HestiaRE - Tachyon FPM pool (served by the Panel-Caddy's internal webmail
; listener, see share/panel-caddy/webmail-tachyon.conf; deployed by
; h-add-sys-tachyon, removed by h-delete-sys-tachyon, #205).
; Runs as the caddy user - matches the caddy:caddy data dir (/etc/tachyon/data)
; that h-add-sys-tachyon creates. This is what fixes W7 (#234): the old model
; rendered caddy-owned data with a www-data pool -> "Permission denied!".
; NOTE: php-fpm parses pool configs as PHP-INI - comments MUST use ';' not '#'.
[tachyon]
listen = /run/hestia-webmail-tachyon.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

user = caddy
group = caddy

pm = ondemand
pm.max_children = 6
pm.max_requests = 1000
pm.process_idle_timeout = 10s

env[PATH] = /usr/local/bin:/usr/bin:/bin
; C.UTF-8, not en_US.UTF-8: that one is generated on none of the four targets, so every
; locale-aware child warned. This is built into glibc and needs no locale-gen.
env[LANG] = C.UTF-8

catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/hestia-php-fpm.log
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 256M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
; Dedicated tmp next to the install dir; created + chowned caddy:caddy by
; h-add-sys-tachyon (Tachyon's own state lives in /etc/tachyon/data).
php_admin_value[session.save_path] = /var/lib/tachyon/tmp
php_admin_value[upload_tmp_dir] = /var/lib/tachyon/tmp
php_admin_value[sys_temp_dir] = /var/lib/tachyon/tmp
