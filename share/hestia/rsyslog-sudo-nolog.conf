# HestiaRE #693: sudo logs every allowed command line - panel-set passwords in argv included -
# to authpriv. Classic sudo is silenced via !log_allowed in sudoers; sudo-rs (ubuntu 26.04)
# validates no logging option, so this drop rule is the file-level cure there (deployed on
# every box - a harmless second layer where sudoers already suppresses). The journald copy
# remains; the argv-free h-* secrets API is the complete fix.
if $programname == "sudo" and $msg contains "COMMAND=/usr/local/hestia/bin/" then stop
