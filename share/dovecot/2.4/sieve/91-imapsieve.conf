##
## HestiaRE - learning from what the customer does in IMAP. 2.4 syntax: named blocks replaced the
## imapsieve_mailboxN_* keys, shape taken from the package's own 90-sieve.conf. Inert unless
## imap_sieve is in the IMAP protocol's mail_plugins, which h-add-sys-sieve puts there.
##
## Into the spam folder means "this is spam". Spam, not Junk: exim files spam into .Spam directly.
mailbox Spam {
  sieve_script report-spam {
    type = before
    cause = copy
    path = /etc/dovecot/sieve/report-spam.sieve
  }
}

## Out of it, anywhere, means the verdict was wrong.
imapsieve_from Spam {
  sieve_script report-ham {
    type = before
    cause = copy
    path = /etc/dovecot/sieve/report-ham.sieve
  }
}
