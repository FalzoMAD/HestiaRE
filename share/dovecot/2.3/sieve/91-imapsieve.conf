##
## HestiaRE - learning from what the customer does in IMAP. 2.3 syntax. Inert unless imap_sieve is
## in the IMAP protocol's mail_plugins, which h-add-sys-sieve puts there: the hook that runs these
## rules lives in the imap process, not here.
##
plugin {
  ## Into the spam folder means "this is spam". Spam, not the Junk most recipes assume: exim files
  ## spam into .Spam directly.
  imapsieve_mailbox1_name = Spam
  imapsieve_mailbox1_causes = COPY
  imapsieve_mailbox1_before = file:/etc/dovecot/sieve/report-spam.sieve

  ## Out of it, anywhere, means the verdict was wrong.
  imapsieve_mailbox2_name = *
  imapsieve_mailbox2_from = Spam
  imapsieve_mailbox2_causes = COPY
  imapsieve_mailbox2_before = file:/etc/dovecot/sieve/report-ham.sieve
}
