# WebSocket upgrade for proxied vhosts (#566): the docker templates hand Upgrade through with the
# Connection value derived here. Defined once at http context - a per-vhost map would fail on
# redefinition as soon as a second docker domain exists. Written once at install and never
# touched again: no per-domain content in here, and it stays in place when the last docker domain
# goes - unlike the per-domain cache zones (#583 class), there is nothing to clean up or reconcile.
map $http_upgrade $connection_upgrade {
	default upgrade;
	""      close;
}
