# Curated blocklist sources offered in the panel's IPset picker.
#
# Replaces a hard-coded PHP entry pointing at install/common/firewall/ipset/blacklist.sh - a path that went
# away with the install/ tree, so the shipped preset always failed on the minimum-size check with a
# misleading error. Sources live here so adding one is a data change; each was fetched from a VM and
# confirmed to yield parseable entries after h-add-firewall-ipset's comment stripping.
#
# Spamhaus DROP is gone (2026-09-01): FireHOL Level 1 names spamhaus_drop as a source and contains
# all 1708 of its networks, and www.spamhaus.org has no AAAA. Re-adding needs a fresh measurement.
#
# LEVEL is advisory for the operator: 1 = conservative, safe to DROP outright; 2 = broader, expect the odd
# false positive on shared hosting. Nothing enforces it - the ACTION on the rule referencing the set is the
# operator's choice, as with country lists.
NAME='FireHOL Level 1' LEVEL='1' FAMILY='v4' SOURCE='https://iplists.firehol.org/files/firehol_level1.netset'
NAME='FireHOL Level 2' LEVEL='2' FAMILY='v4' SOURCE='https://iplists.firehol.org/files/firehol_level2.netset'
# The next two rows name the SAME url on purpose: the list is mixed and the loader keeps only the
# declared version, so each family gets its own set (~29400 v4, ~340 v6). Picking both loads it twice.
NAME='Blocklist.de (all)' LEVEL='2' FAMILY='v4' SOURCE='https://lists.blocklist.de/lists/all.txt'
NAME='Blocklist.de (all, IPv6)' LEVEL='2' FAMILY='v6' SOURCE='https://lists.blocklist.de/lists/all.txt'
