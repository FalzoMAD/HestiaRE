# HestiaRE system limits. Edit by hand - an update never touches this file.
#
# CUSTOMER_PHP_CPU_PERCENT: how much of the WHOLE machine all customer php-fpm
# masters may use together (10-100; 100 is no cap in practice). It protects
# panel, mail, database and ssh from customer web load - it does not separate
# customers from each other, and the panel PHP has its own master outside it.
#
# Applied at every boot by hestia-customer-php-limit.service, which multiplies
# by the core count because systemd counts CPUQuota per core: 75 on an 8-core
# box becomes CPUQuota=600%. Add cores and reboot, and the cap grows with the
# machine - nothing absolute is stored anywhere.
CUSTOMER_PHP_CPU_PERCENT=75
