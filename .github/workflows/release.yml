name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Build tarball
        run: |
          # VERSION aus dem Tag in die Datei schreiben
          echo "${VERSION}" > VERSION
          mkdir -p dist/hestiare-${VERSION}
          # Dev-only trees never ship: the tarball is what lands on a customer box.
          EXCLUDES=$(grep 'export-ignore' .gitattributes | awk '{print $1}')
          rsync -a \
            --exclude='.git*' \
            --exclude='dist' \
            $(for e in $EXCLUDES; do echo "--exclude=$e"; done) \
            . dist/hestiare-${VERSION}/
          tar -czf dist/hestiare-${VERSION}.tar.gz -C dist hestiare-${VERSION}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/hestiare-${{ env.VERSION }}.tar.gz
          generate_release_notes: false
          body: |
            HestiaRE ${{ env.VERSION }}

            Install:
              curl -fsSL https://hestiare.com/install.sh
              bash install.sh
